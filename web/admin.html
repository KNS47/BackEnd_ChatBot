                            <option value="ข้อมูลพื้นฐาน">ข้อมูลพื้นฐาน</option>
                            <option value="ข้อมูลการให้บริการประชาชน">ข้อมูลการให้บริการประชาชน</option>
                            <option value="ศูนย์ข้อมูลข่าวสาร">ศูนย์ข้อมูลข่าวสาร</option>
                            <option value="ข้อมูลมาตรการความ">ข้อมูลมาตรการความ</option>
                            <option value="โปร่งใสการจัดการทุจริต">โปร่งใสการจัดการทุจริต</option>
                            <option value="ข้อมูลการดำเนินการเพื่อป้องกันการทุจริต">ข้อมูลการดำเนินการเพื่อป้องกันการทุจริต</option>

<script src="/config.js"></script>
<script src="/staff.js"></script>
<script>
    const uploadButton = document.getElementById("uploadBtn");
    const cancelUpload = document.getElementById("cancel-upload");
    const listStatus = document.getElementById("documents-status");
    const reloadButton = document.getElementById("reload-documents");
    let transmitting = null;
    cancelUpload.addEventListener("click", () => transmitting?.abort());

    async function checkAuth() {
        try {
            const res = await staffFetch("/api/check-admin");
            const status = await res.json();
            if (!status.authenticated) {
                window.location.replace("/login.html");
                return false;
            }
            return true;
        } catch {
            listStatus.textContent = "ตรวจเซสชันไม่ได้ กรุณาลองโหลดอีกครั้ง";
            reloadButton.hidden = false;
            return false;
        }
    }
    // --- เก็บข้อมูลเอกสารทั้งหมดไว้ filter ---
    let allDocs = [];

    function filterByCategory() {
        const selected = document.getElementById("filterCategory").value;
        const filtered = selected ? allDocs.filter(d => d.category === selected) : allDocs;
        renderTable(filtered);
        const count = document.getElementById("filterCount");
        count.textContent = selected ? `แสดง ${filtered.length} จาก ${allDocs.length} รายการ` : `${allDocs.length} รายการ`;
    }

    function renderTable(docs) {
        const tbody = document.getElementById("pdfList");
        tbody.innerHTML = "";

        if (docs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">ไม่พบเอกสารในหมวดหมู่นี้</td></tr>';
            return;
        }

        docs.forEach((doc) => {
            const file = doc.source;
            const displayName = doc.original_name || file;
            const category = doc.category;
            const ext = displayName.split('.').pop().toUpperCase();

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <div class="d-flex align-items-center">
                        <svg class="icon pdf-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#document"></use></svg>
                        <div>
                            <div class="fw-bold text-dark"></div>
                        </div>
                    </div>
                </td>
                <td class="text-center">
                    <span class="badge bg-light text-dark border"></span>
                </td>
                <td class="text-center">
                    <span class="text-secondary"></span>
                </td>
                <td class="text-center">
                    <span class="badge badge-active rounded-pill">ใช้งาน</span>
                </td>
                <td class="text-end">
                    <div class="document-actions">
                        <button type="button" class="btn btn-sm btn-outline-primary" aria-label="ดูเอกสาร">
                            <svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#eye"></use></svg> <span>ดู</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary" aria-label="ดาวน์โหลดเอกสาร">
                            <svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#download"></use></svg> <span>ดาวน์โหลด</span>
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger" aria-label="ลบเอกสาร">
                            <svg class="icon" aria-hidden="true" focusable="false"><use href="/icons.svg#trash"></use></svg> <span>ลบ</span>
                        </button>
                    </div>
                </td>
            `;
            row.querySelector(".fw-bold").textContent = displayName;
            row.querySelector(".bg-light").textContent = ext;
            row.querySelector(".text-secondary").textContent = category;
            const encodedSource = encodeURIComponent(file);
            const downloadUrl = `${window.API_BASE}/pdfs/download/${encodedSource}`;
            const [view, download, remove] = row.querySelectorAll("button");
            view.addEventListener("click", () => window.open(downloadUrl, "_blank", "noopener"));
            download.addEventListener("click", () => window.location.assign(downloadUrl));
            remove.addEventListener("click", () => deletePDF(encodedSource, displayName, remove));
            tbody.appendChild(row);
        });
    }

    function uploadPDF() {
        const fileInput = document.getElementById("pdfFile");
        const file = fileInput.files[0];
        const button = uploadButton;
        const progressWrapper = document.getElementById("progressWrapper");
        const progressBar = document.getElementById("progressBar");
        const statusText = document.getElementById("uploadStatus");

        function setStatus(message, tone = "secondary") {
            statusText.className = `text-${tone} mt-2 d-block`;
            statusText.textContent = message;
        }

        if (!file) {
            setStatus("กรุณาเลือกไฟล์ PDF", "danger");
            return;
        }
        if (file.size > 20 * 1024 * 1024) {
            setStatus("รองรับไฟล์ไม่เกิน 20 MB", "danger");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("category", document.getElementById("category").value);

        if (button.disabled) return;
        button.disabled = true;
        progressWrapper.style.display = "flex";
        progressBar.style.width = "0%";
        progressBar.setAttribute("aria-valuenow", "0");
        setStatus("กำลังอัปโหลดไฟล์…");

        const xhr = new XMLHttpRequest();
        transmitting = xhr;
        cancelUpload.hidden = false;
        function endTransmission() {
            if (transmitting === xhr) transmitting = null;
            cancelUpload.hidden = true;
        }
        xhr.upload.addEventListener("progress", event => {
            if (event.lengthComputable) {
                const percent = Math.round(event.loaded / event.total * 100);
                progressBar.style.width = `${percent}%`;
                progressBar.setAttribute("aria-valuenow", String(percent));
                if (event.loaded >= event.total) endTransmission();
            }
        });
        xhr.upload.addEventListener("load", () => {
            endTransmission();
            setStatus("ส่งไฟล์แล้ว กำลังรอระบบอ่านข้อความและเพิ่มเข้าฐานความรู้…");
        });
        xhr.addEventListener("load", () => {
            if (xhr.status === 200) {
                setStatus(xhr.response?.message || "เพิ่มเอกสารเข้าฐานความรู้แล้ว", "success");
                fileInput.value = "";
                loadPDFs();
                refreshStaffUsage();
            } else if (xhr.status === 401) {
                window.location.replace("/login.html");
            } else {
                setStatus(xhr.response?.error || "ประมวลผลเอกสารไม่สำเร็จ กรุณาลองใหม่", "danger");
            }
        });
        xhr.addEventListener("error", () => {
            setStatus("การเชื่อมต่อขาดหาย กรุณาตรวจรายการเอกสารก่อนลองใหม่", "danger");
            loadPDFs();
        });
        xhr.addEventListener("timeout", () => {
            setStatus("ระบบใช้เวลานาน กรุณาตรวจรายการเอกสารก่อนลองอัปโหลดอีกครั้ง", "danger");
            loadPDFs();
        });
        xhr.addEventListener("abort", () => {
            setStatus("หยุดการส่งจากเบราว์เซอร์แล้ว กำลังตรวจรายการเอกสารอีกครั้ง");
            loadPDFs();
        });
        xhr.addEventListener("loadend", () => {
            endTransmission();
            progressWrapper.style.display = "none";
            button.disabled = false;
        });

        xhr.open("POST", `${window.API_BASE}/upload-pdf`);
        xhr.timeout = 180000;
        xhr.responseType = "json";
        xhr.withCredentials = true;
        xhr.send(formData);
    }
    // --- ฟังก์ชันโหลดรายการไฟล์ ---
    async function loadPDFs() {
        const tbody = document.getElementById("pdfList");
        const categoryFilter = document.getElementById("filterCategory");
        reloadButton.hidden = true;
        categoryFilter.disabled = true;
        listStatus.textContent = "กำลังโหลดรายการเอกสาร…";
        tbody.replaceChildren();

        try {
            const res = await staffFetch("/pdfs");
            const data = await res.json();
            allDocs = data.files || [];
            categoryFilter.disabled = false;
            filterByCategory();
            listStatus.textContent = "";
        } catch {
            document.getElementById("filterCount").textContent = "";
            listStatus.textContent = "โหลดรายการเอกสารไม่สำเร็จ";
            reloadButton.hidden = false;
        }
    }

    const deleteReview = document.getElementById("delete-review");
    const cancelDelete = document.getElementById("cancel-delete");
    const confirmDelete = document.getElementById("confirm-delete");
    let pendingDelete = null;

    function deletePDF(encodedSource, displayName, button) {
        if (confirmDelete.disabled) return;
        if (pendingDelete) pendingDelete.button.disabled = false;
        pendingDelete = {encodedSource, button};
        button.disabled = true;
        document.getElementById("delete-message").textContent = `ลบ «${displayName}» ออกจากคลังเอกสาร? หลังลบแล้วจะกู้คืนจากหน้านี้ไม่ได้`;
        deleteReview.hidden = false;
        cancelDelete.focus();
    }

    function closeDeleteReview(restoreFocus = false) {
        const button = pendingDelete?.button;
        if (button) button.disabled = false;
        pendingDelete = null;
        deleteReview.hidden = true;
        if (restoreFocus) button?.focus();
    }

    cancelDelete.addEventListener("click", () => {
        closeDeleteReview(true);
        listStatus.textContent = "ยกเลิกแล้ว เอกสารยังอยู่ในคลัง";
    });
    deleteReview.addEventListener("keydown", event => {
        if (event.key === "Escape" && !cancelDelete.disabled) cancelDelete.click();
    });

    confirmDelete.addEventListener("click", async () => {
        if (!pendingDelete) return;
        const {encodedSource} = pendingDelete;
        const status = document.getElementById("uploadStatus");
        const message = document.getElementById("delete-message");
        confirmDelete.disabled = true;
        cancelDelete.disabled = true;
        message.textContent = "กำลังลบเอกสาร…";
        try {
            await staffFetch(`/pdf/${encodedSource}`, {method: "DELETE"});
            status.textContent = "ลบเอกสารแล้ว";
            await loadPDFs();
            refreshStaffUsage();
        } catch {
            status.textContent = "ยืนยันผลการลบไม่ได้ กรุณาโหลดรายการใหม่ก่อนลองอีกครั้ง";
            reloadButton.hidden = false;
        } finally {
            closeDeleteReview();
            confirmDelete.disabled = false;
            cancelDelete.disabled = false;
        }
    });

    async function loadStaffDocuments() {
        reloadButton.hidden = true;
        listStatus.textContent = "กำลังตรวจเซสชัน…";
        if (await checkAuth()) {
            uploadButton.disabled = false;
            await loadPDFs();
        }
    }
    reloadButton.addEventListener("click", loadStaffDocuments);
    loadStaffDocuments();
</script>
</body>
</html>
